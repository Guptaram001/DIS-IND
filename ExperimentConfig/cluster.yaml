cluster:
  ssh_user: node

  coordinator:
    host: 192.168.2.139
    advertised_ip: 192.168.2.139
    output_base: /home/node/dis-ind-results
    java_xmx: 8g

  workers:
    - {host: 192.168.2.233, advertised_ip: 192.168.2.233}
    - {host: 192.168.2.232, advertised_ip: 192.168.2.232}
    - {host: 192.168.2.90, advertised_ip: 192.168.2.90}
    - {host: 192.168.2.138, advertised_ip: 192.168.2.138}
    - {host: 192.168.2.89, advertised_ip: 192.168.2.89}
    - {host: 192.168.2.157, advertised_ip: 192.168.2.157}

  worker_defaults:
    java_xms: 2g
    java_xmx: 8g

  akka:
    port: 2551
    maximum_frame_size: 64MiB
    buffer_pool_size: 4
    startup_timeout_seconds: 600

deployment:
  git_url: https://github.com/Guptaram001/DIS-IND.git
  git_branch: pruneTest
  project_dir: /home/node/dis-ind
  state_base: /home/node/.local/state/dis-ind
