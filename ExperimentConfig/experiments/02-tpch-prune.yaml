experiment:
  name: tpch-count
  enabled: true
  repeats: 1
  timeout_seconds: 3600

dataset:
  name: mb
  input_dir: /home/node/DIS-IND/data/mb

application:
  data_orientation: value
  candidate_tracking: prune
  ingestion_mode: insert
  chunk_size: 5000000
  prune_cqf_enabled: false
  prune_partition_counts_enabled: true
  prune_partition_hierarchy_enabled: true
  prune_transitive_enabled: false
  prune_count_partitions: 64
  ind_calculation: batch
  cluster_change_detection: false

resources:
  coordinator_java_xmx: 8g
  worker_java_xmx: 8g
