akka {
  loglevel = "INFO"
  stdout-loglevel = "WARNING"

  actor {
    provider = cluster

    # Allow jackson serialization, if needed fall back to java
    allow-java-serialization = off
    warn-about-java-serializer-usage = off

    serializers {
      jackson-cbor = "akka.serialization.jackson.JacksonCborSerializer"
    }

    debug {
      unhandled = on
    }

    serialization-bindings {
      "disIND.prototypeModel.model.AkkaSerializable" = jackson-cbor
      "disIND.streamBasedShardedDispatcher.model.AkkaSerializable" = jackson-cbor
      "disIND.valueBased.model.AkkaSerializable" = jackson-cbor
    }
    
    # Default dispatcher for worker actors - reduced throughput, best for RCs, statistics, Acks
    default-dispatcher {
      type = Dispatcher
      executor = "fork-join-executor"
      fork-join-executor {
        parallelism-min = 2
        parallelism-max = 2  
        parallelism-factor = 1.0
      }
      throughput = 5
    }

    # Default dispatcher for worker actors - high throughput, best for CMs
    cpu-intensive-dispatcher {
      type = Dispatcher
      executor = "fork-join-executor"
      fork-join-executor {
        parallelism-min = 2
        parallelism-max = 2  
        parallelism-factor = 1.0
      }
      throughput = 20
    }

    # # Dedicated dispatcher for heartbeat and cluster management
    # Currently not used, if stat shows something might be used .
    # internal-dispatcher {
    #   type = Dispatcher
    #   executor = "fork-join-executor"
    #   fork-join-executor {
    #     parallelism-min = 1
    #     parallelism-max = 2
    #     parallelism-factor = 0.5
    #   }
    #   throughput = 1
    # }

    # Checkpoint I/O dispatcher
    checkpoint-io-dispatcher {
      type = Dispatcher
      executor = "fork-join-executor"
      fork-join-executor {
        parallelism-min = 1
        parallelism-max = 2
        parallelism-factor = 0.5
      }
      throughput = 10
    }

    # Dedicated I/O dispatcher for blocking operations
    vo-work-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor" 
      thread-pool-executor {
        fixed-pool-size = 3 #matches cpu cores
        allow-core-timeout = off #never context switching if idle too
      }
      throughput = 1
    }
  }

  remote.artery {
    canonical.hostname = "127.0.0.1"
    canonical.hostname = ${?AKKA_HOSTNAME}
    canonical.port = 2551
    canonical.port = ${?AKKA_PORT}
    bind.hostname = "0.0.0.0"
    bind.port = 2551
    transport = tcp

    advanced {
      maximum-frame-size = 64 MiB
      maximum-frame-size = ${?AKKA_MAXIMUM_FRAME_SIZE}
      buffer-pool-size = 4
      buffer-pool-size = ${?AKKA_BUFFER_POOL_SIZE}
    }
  }

  cluster {
    roles = ["worker"]
    seed-nodes = ["akka://disIND@127.0.0.1:2551"]
    downing-provider-class = "akka.cluster.sbr.SplitBrainResolverProvider"
    split-brain-resolver.active-strategy = keep-majority
    role.worker.min-nr-of-members = 3
    role.worker.min-nr-of-members = ${?AKKA_MIN_WORKERS}

    failure-detector {
      threshold = 12.0
      acceptable-heartbeat-pause = 10s
      max-sample-size = 1000
      min-std-deviation = 100ms
    }

    sharding {
      number-of-shards = 64
      passivate-idle-entity-after = off
    }
  }
}

akka.serialization.jackson {
  jackson-modules += "disIND.streamBasedShardedDispatcher.model.RoaringBitmapJacksonModule"
  jackson-modules += "disIND.valueBased.model.RoaringBitmapJacksonModule"
}