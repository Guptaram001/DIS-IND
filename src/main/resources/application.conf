akka {
  loglevel = "INFO"
  stdout-loglevel = "WARNING"

  actor {
    provider = cluster

    # Allow jackson serialization , if needed fall back to java
    allow-java-serialization = off
    warn-about-java-serializer-usage = off

    serializers {
        jackson-cbor = "akka.serialization.jackson.JacksonCborSerializer"
      }

    debug {
      unhandled = on
    }

    serialization-bindings {
      "disIND.prototypeModel.model.AkkaSerializable" = jackson-cbor
      "disIND.streamBasedShardedDispatcher.model.AkkaSerializable" = jackson-cbor
      "disIND.valueBased.model.AkkaSerializable" = jackson-cbor
    }
  }

  remote.artery {
    canonical.hostname = "127.0.0.1"
    canonical.hostname = ${?AKKA_HOSTNAME}
    canonical.port = 2551
    canonical.port = ${?AKKA_PORT}
    bind.hostname = "0.0.0.0"
    bind.port = 2551
    transport = tcp

    advanced {
      maximum-frame-size = 64 MiB
      maximum-frame-size = ${?AKKA_MAXIMUM_FRAME_SIZE}

      # 4 * 64 MiB bounds this reusable direct-buffer pool to roughly 256 MiB per JVM   
      buffer-pool-size = 4
      buffer-pool-size = ${?AKKA_BUFFER_POOL_SIZE}
    }
  }

  cluster {
    
    roles = ["worker"]
    seed-nodes = ["akka://disIND@127.0.0.1:2551"]
    downing-provider-class = "akka.cluster.sbr.SplitBrainResolverProvider"
    split-brain-resolver.active-strategy = keep-majority
    role.worker.min-nr-of-members = 3
    role.worker.min-nr-of-members = ${?AKKA_MIN_WORKERS}

    sharding {
      number-of-shards = 64
      # Attribute actors own live checkpoint state and may have a RocksDB write
      # in flight. Idle passivation would discard that state and turn the
      # writer's completion reply into a dead letter.
      passivate-idle-entity-after = off

      # Least-shard allocation balances load across nodes automatically
      # This is critical for skewed datasets: re-balances hot shards
      # Needed to change and test with some other options too
      # Needed to persist to use this which can be resource intensive.
      # least-shard-allocation-strategy {
      #   rebalance-absolute-limit = 4
      #   rebalance-relative-limit = 0.1
      # }


      # rebalance-interval = 10s
      # passivate-idle-entity-after = 5 minutes
      # Rebalance check interval: redistribute shards when load imbalanced
    }
  }
}

akka.serialization.jackson {
  jackson-modules += "disIND.streamBasedShardedDispatcher.model.RoaringBitmapJacksonModule"
  jackson-modules += "disIND.valueBased.model.RoaringBitmapJacksonModule"
}

checkpoint-io-dispatcher {
  type = Dispatcher
  executor = "fork-join-executor"
  thread-pool-executor {
    fixed-pool-size = 4
    fixed-pool-size = ${?DIS_IND_CHECKPOINT_WRITERS_PER_NODE}
  }
  throughput = 100
}
